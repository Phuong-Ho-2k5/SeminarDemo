# Real local runtime test only: config is outside the root .dev.vars directory.
name = "neon-seminar-no-secret-test"
main = "../../src/worker.js"
compatibility_date = "2026-11-27"
workers_dev = false

[assets]
directory = "../../public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "PersistentCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PersistentCounter"]
