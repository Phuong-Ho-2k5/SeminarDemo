name = "neon-workers-seminar"
main = "src/worker.js"
compatibility_date = "2026-11-27"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "none"

[[durable_objects.bindings]]
name = "COUNTER"
class_name = "PersistentCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PersistentCounter"]

[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"
